# Sobe a Evolution API, a IA e o bot. O Postgres e o Redis são os que já rodam
# na rede "venv_evolution-net"; a Evolution usa um banco próprio (chatbot_evolution).
services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${EVOLUTION_DATABASE_URI}
      DATABASE_CONNECTION_CLIENT_NAME: chatbot
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/4
      CACHE_REDIS_PREFIX_KEY: chatbot-evolution
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://bot:8000/webhook/${WEBHOOK_TOKEN}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - default
      - evolution

  ollama:
    image: ollama/ollama:0.40.10
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434" # acessível só desta máquina, para testes
    environment:
      OLLAMA_KEEP_ALIVE: "-1" # mantém o modelo carregado na memória entre as conversas
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 10

  # Baixa o modelo na primeira execução e encerra; nas próximas vezes é instantâneo
  ollama-pull:
    image: ollama/ollama:0.40.10
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3:4b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy

  bot:
    build: ./bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      EVOLUTION_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
      ALLOWED_NUMBERS: ${ALLOWED_NUMBERS:-}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
    networks:
      - default
      - evolution
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

networks:
  evolution:
    name: ${EVOLUTION_NETWORK:-venv_evolution-net}
    external: true

volumes:
  evolution_instances:
  ollama_models:
