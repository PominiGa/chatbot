# Sobe a IA e o bot. A Evolution API, o Postgres e o Redis são os que já rodam
# no projeto Automacao (rede "venv_evolution-net").
services:
  ollama:
    image: ollama/ollama:0.40.10
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434" # acessível só desta máquina, para testes
    environment:
      OLLAMA_KEEP_ALIVE: "-1" # mantém o modelo carregado na memória entre as conversas
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 10

  # Baixa o modelo na primeira execução e encerra; nas próximas vezes é instantâneo
  ollama-pull:
    image: ollama/ollama:0.40.10
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3:4b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy

  bot:
    build: ./bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      EVOLUTION_URL: ${EVOLUTION_URL:-http://evolution_api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
      ALLOWED_NUMBERS: ${ALLOWED_NUMBERS:-}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
    networks:
      - default
      - evolution
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

networks:
  evolution:
    name: ${EVOLUTION_NETWORK:-venv_evolution-net}
    external: true

volumes:
  ollama_models:
